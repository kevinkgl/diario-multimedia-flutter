name: Compilar APK Android de Producción

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@v4

      - name: 2. Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 3. Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: 4. Verificar configuración de Flutter
        run: flutter doctor -v

      - name: 5. Descargar dependencias de Flutter
        working-directory: flutter_project
        run: flutter pub get

      - name: 6. Compilar APK en modo Release
        working-directory: flutter_project
        run: |
          flutter build apk --release --no-tree-shake-icons

      - name: 7. Renombrar APK para distribución
        run: |
          mkdir -p output_apk
          cp flutter_project/build/app/outputs/flutter-apk/app-release.apk output_apk/DiarioMultimedia-v1.0.0.apk

      - name: 8. Subir APK como Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: DiarioMultimedia-Android-APK
          path: output_apk/DiarioMultimedia-v1.0.0.apk
          retention-days: 30

      - name: 9. Publicar Release en GitHub con APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "Diario Personal Multimedia v1.0.0 (APK)"
          body: |
            ### 📱 Instalador APK para Android (Listo para instalar)
            
            Este APK fue compilado automáticamente en GitHub Actions para producción.
            
            **Características incluidas:**
            - 🎥 Grabación de video con cámara frontal por defecto.
            - 🎙️ Transcripción simultánea en tiempo real (`speech_to_text`).
            - 📝 Hoja de cuaderno pautada con caligrafía fluida.
            - ☁️ Subida y streaming a Google Drive (`drive.file`).
            - 🔒 Regla estricta 1:1 de privacidad y seguridad en Firestore.
            - 📴 Almacenamiento temporal en caché SQLite (`sqflite`) y auto-sincronización.
          files: output_apk/DiarioMultimedia-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
